[package]
name = "soroban-audit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Unified CLI binary for Soroban smart contracts: hooks WASM bytecode, executes invariant campaigns, tests TTL boundaries, and generates SHA-256 tamper-evident security audit certificates."
readme = "README.md"

[[bin]]
name = "soroban-audit"
path = "src/main.rs"

[lib]
name = "soroban_audit"
path = "src/lib.rs"

[dependencies]
soroban-fuzz-core = { version = "0.1.0", path = "../soroban-fuzz-core" }
soroban-sdk = { version = "22.0.11", features = ["testutils"] }
soroban-env-host = { version = "22.1.3" }
clap = { version = "4.4", default-features = false, features = ["std", "derive", "help", "usage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
anyhow = "1.0"
thiserror = "2.0"

